<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Sleek Modern Sun -->
  <g transform="translate(10, -6)">
    <!-- Sun Rays (Crisp, Elegant Rounded Dashes) -->
    <g stroke="#F59E0B" stroke-width="3" stroke-linecap="round">
      <line x1="62" y1="18" x2="62" y2="12" />
      <line x1="77.6" y1="24.4" x2="81.8" y2="20.2" />
      <line x1="84" y1="40" x2="90" y2="40" />
      <line x1="77.6" y1="55.6" x2="81.8" y2="59.8" />
      <line x1="46.4" y1="24.4" x2="42.2" y2="20.2" />
    </g>

    <!-- Sun Disc (Vibrant Amber/Gold) -->
    <circle cx="62" cy="40" r="16" fill="#FBBF24" stroke="#F59E0B" stroke-width="2" />
  </g>

  <!-- Sleek Modern Cloud (Smooth Minimalist Geometry) -->
  <g>
    <!-- Soft Flat Shadow Base -->
    <path 
      d="M 28 80 
         h 44 
         a 15 15 0 0 0 13 -22.5 
         a 18 18 0 0 0 -22 -14.5 
         a 22 22 0 0 0 -33 11 
         a 14 14 0 0 0 -14 13 
         a 13 13 0 0 0 12 13 Z" 
      fill="#E2E8F0" 
    />

    <!-- Pure White Front Cloud Surface -->
    <path 
      d="M 28 77 
         h 44 
         a 14 14 0 0 0 12 -21 
         a 17 17 0 0 0 -21 -13.5 
         a 21 21 0 0 0 -31 10.5 
         a 13 13 0 0 0 -13 12 
         a 12 12 0 0 0 11 12 Z" 
      fill="#FFFFFF" 
      stroke="#CBD5E1" 
      stroke-width="1.5" 
      stroke-linejoin="round"
    />
  </g>
</svg>
