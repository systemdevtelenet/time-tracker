<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Sleek Sun Rays -->
  <g stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round">
    <!-- Orthogonal -->
    <line x1="50" y1="18" x2="50" y2="10" />
    <line x1="50" y1="82" x2="50" y2="90" />
    <line x1="18" y1="50" x2="10" y2="50" />
    <line x1="82" y1="50" x2="90" y2="50" />
    <!-- Diagonal -->
    <line x1="27.4" y1="27.4" x2="21.7" y2="21.7" />
    <line x1="72.6" y1="72.6" x2="78.3" y2="78.3" />
    <line x1="27.4" y1="72.6" x2="21.7" y2="78.3" />
    <line x1="72.6" y1="27.4" x2="78.3" y2="21.7" />
  </g>

  <!-- Sun Disc -->
  <circle cx="50" cy="50" r="22" fill="#FBBF24" stroke="#F59E0B" stroke-width="2.5" />
  <circle cx="50" cy="50" r="17" fill="#FDE047" />
</svg>
