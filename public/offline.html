<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2F6798">
    <title>Offline | Workforce Portal</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f4f7fb; color: #17283b; font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 440px; text-align: center; }
      img { width: 72px; height: 72px; margin-bottom: 16px; }
      h1 { margin: 0 0 12px; font-size: 26px; }
      p { margin: 0 0 24px; color: #536172; }
      a { display: inline-block; padding: 12px 22px; border-radius: 8px; background: #2f6798; color: #fff; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 3px solid #c8a54b; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.png" alt="">
      <h1>You're offline</h1>
      <p>Reconnect to view current records or record a shift action. Nothing has been submitted while offline.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
